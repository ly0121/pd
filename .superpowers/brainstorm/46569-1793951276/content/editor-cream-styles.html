<h2>编辑页的奶油风格：你更喜欢哪一种？</h2><p class="subtitle">只更改图纸周围的界面，不给真实豆色加滤镜。点击卡片选择，再回终端告诉我感受。</p><style>.styles{display:flex;gap:18px;flex-wrap:wrap}.style-card{flex:1;min-width:245px;cursor:pointer;border:2px solid #e5dfdc;border-radius:18px;padding:12px}.style-card:hover{border-color:#dc98aa}.phone{max-width:280px;margin:auto;height:440px;display:flex;flex-direction:column;border:1px solid #e6d8d0;border-radius:24px;overflow:hidden;font:14px system-ui}.top{padding:18px 12px;text-align:center;font-weight:700}.art{flex:1;display:flex;align-items:center;justify-content:center;padding:15px}.grid{width:95%;aspect-ratio:1;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);border:1px solid #797077}.cell{box-sizing:border-box;border-right:1px solid #aaa5a0;border-bottom:1px solid #aaa5a0}.cell:nth-child(10n + 5){border-right:2px solid #5e5155}.cell:nth-child(n + 41):nth-child(-n + 50){border-bottom:2px solid #5e5155}.colors{display:flex;justify-content:space-around;padding:14px 8px 9px;font-size:10px;text-align:center}.swatch{width:29px;height:29px;border-radius:50%;margin:0 auto 4px}.tools{padding:14px 10px;display:flex;justify-content:space-around;font-size:21px}.soft{background:#fff9f0;color:#584b46}.soft .top,.soft .tools{background:#fffcf7}.soft .art{background:#fff6eb}.soft .colors{background:#fff1e8;border-top:1px solid #f5e2d9}.soft .active{background:#f8d6d9;border-radius:12px}.playful{background:#fff6ed;color:#5c4949}.playful .top{background:#ffe9df}.playful .art{background:linear-gradient(145deg,#fff8e7,#fff0e5)}.playful .colors{background:#ffe9df;border-radius:20px 20px 0 0}.playful .tools{background:#fff9f1}.playful .active{background:#f5c5cb;border-radius:12px}.legend{font-weight:600;margin:12px 4px 5px}</style><div class="styles" id="styles"></div><script>const colors=['#fff','#d9c2cc','#a41d46','#faca45','#b8db54','#ffdd5a','#8aa63c','#cc0040'];const options=[{id:'soft',title:'A · 轻奶油',desc:'奶油白留白、杏粉色卡、柔和玫瑰粉选中态；清爽，不抢图纸。'},{id:'playful',title:'B · 甜品奶油',desc:'暖黄背景、蜜桃粉色卡、明显的圆角分区；更可爱，装饰感更强。'}];document.getElementById('styles').innerHTML=options.map(o=>`<div class="style-card" data-choice="${o.id}" onclick="toggleSelect(this)"><div class="phone ${o.id}"><div class="top">‹　拼豆图纸　 ♡　　 保存</div><div class="art"><div class="grid">${Array.from({length:100},(_,i)=>`<div class="cell" style="background:${colors[(Math.floor(i/10)+Math.floor(i%10/3))%colors.length]}"></div>`).join('')}</div></div><div class="colors">${colors.slice(0,6).map((c,i)=>`<div><div class="swatch" style="background:${c}"></div>${['H2','F20','F7','A26','B29','A8'][i]}</div>`).join('')}</div><div class="tools"><span class="active">🖌</span><span>◩</span><span>✎</span><span>✦</span><span>↶</span><span>↷</span></div></div><div class="legend">${o.title}</div><p>${o.desc}</p></div>`).join('');</script>
